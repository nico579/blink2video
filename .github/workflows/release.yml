name: Release (build 3 OS)

# Construction des bundles autonomes sur les trois systèmes, puis publication
# sur la release. PyInstaller n'est pas un compilateur croisé : chaque binaire
# doit être produit sur son système natif, avec sa propre copie de ffmpeg. Les
# runners GitHub le font gratuitement, ce qui évite d'avoir un Mac et une
# machine Linux sous la main.
#
# Déclenchement :
#   - poussée d'une étiquette stable vX.Y.Z
#   - manuel, en indiquant l'étiquette
#
# Fichiers produits :
#   blink2video-windows-x86_64.zip
#   blink2video-linux-x86_64.tar.gz
#   blink2video-macos-arm64.zip
#   blink2video-windows7-x86_64-experimental.zip

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release (ex : v1.0.0)"
        required: true

jobs:
  # L'etiquette et le code doivent dire la meme version. Sans ce controle, on
  # peut publier v9.9.9 depuis un code qui se croit en 0.2.1, et le binaire
  # telecharge ment sur ce qu'il est.
  version:
    name: etiquette et code d'accord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comparer
        shell: bash
        run: |
          etiquette="${{ github.event.inputs.tag || github.ref_name }}"
          code="v$(python -c 'import runtime; print(runtime.VERSION)')"
          echo "etiquette $etiquette, code $code"
          if [ "$etiquette" != "$code" ]; then
            echo "::error::l'etiquette $etiquette ne correspond pas a runtime.VERSION ($code)"
            exit 1
          fi

  build:
    name: build ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: blink2video-windows-x86_64
            archive: zip
            exe: dist/blink2video/blink2video.exe
          - os: ubuntu-22.04
            asset: blink2video-linux-x86_64
            archive: tar
            exe: dist/blink2video/blink2video
          - os: macos-latest
            asset: blink2video-macos-arm64
            archive: zip
            exe: dist/blink2video/blink2video

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Le même build.py qu'en local : il crée son environnement isolé et
      # appelle PyInstaller. Une seule recette à maintenir, et ce qui est
      # publié est exactement ce qu'on peut reproduire chez soi.
      - name: Construire le bundle
        run: python build.py

      - name: Vérifier que l'exécutable répond
        shell: bash
        run: ${{ matrix.exe }} --help

      # ffmpeg rend le bundle autonome, mais sa seule présence ne suffit pas :
      # les compilations sans libfreetype produisent des vidéos sans horodatage,
      # sans la moindre erreur. On refuse de publier une archive muette.
      - name: Vérifier que ffmpeg sait incruster du texte
        shell: bash
        run: |
          embarque=$(find dist/blink2video -iname 'ffmpeg*' -type f | head -1)
          test -n "$embarque" || { echo "ffmpeg absent du bundle"; exit 1; }
          echo "ffmpeg embarqué : $embarque"
          "$embarque" -hide_banner -filters | grep -q drawtext             || { echo "le ffmpeg embarqué ne sait pas incruster de texte"; exit 1; }

      # Épreuve complète sur l'exécutable qui sera publié, horodatage compris.
      - name: Éprouver la chaîne vidéo depuis le bundle
        shell: bash
        env:
          BLINK_TEST_BUNDLE: ${{ matrix.exe }}
        run: |
          python -m pip install --quiet aiohttp blinkpy certifi tzdata imageio-ffmpeg
          python tests.py

      - name: Empaqueter (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: cd dist && 7z a -tzip "${{ matrix.asset }}.zip" blink2video || zip -r "${{ matrix.asset }}.zip" blink2video

      - name: Empaqueter (tar.gz)
        if: matrix.archive == 'tar'
        run: cd dist && tar czf "${{ matrix.asset }}.tar.gz" blink2video

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*

  # Meme recette que le CI continu sur main (voir build-win7.yml), construite
  # ici pour l'etiquette de la release plutot que pour la HEAD de main. Best
  # effort par nature (edition experimentale, hors support Microsoft) : un
  # echec ici ne doit pas retenir les trois bundles stables, d'ou le job
  # separe et le "if" de publish plus bas, meme raisonnement que pour docker.
  build-win7:
    name: build Windows 7 (experimental)
    needs: version
    uses: ./.github/workflows/build-win7.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # Image publiee sur Docker Hub, en plus des trois binaires. Job separe du
  # matriciel "build" : un echec ici (secrets Docker Hub absents ou invalides)
  # ne doit jamais empecher la publication des binaires, qui n'en dependent
  # pas. Necessite deux secrets du depot (Settings > Secrets and variables >
  # Actions) : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton d'acces cree sur
  # hub.docker.com > Account Settings > Security, jamais le mot de passe du
  # compte).
  docker:
    name: publier l'image Docker
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN vivent dans l'environnement GitHub
    # "docker" (Settings > Environments), pas en secrets de repo : sans cette
    # ligne, un job ne voit que les secrets de repo, jamais ceux d'un
    # environnement, meme du meme nom.
    environment: docker
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Deduire la version (sans le "v")
        id: etiquette
        shell: bash
        run: |
          etiquette="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${etiquette#v}" >> "$GITHUB_OUTPUT"

      # QEMU emule les autres architectures sur le runner amd64 de GitHub,
      # pour que buildx puisse construire l'image arm64 (Raspberry Pi, Apple
      # Silicon sous Docker Desktop) sans machine arm dediee. Buildx est le
      # constructeur multi-plateforme de Docker depuis 2019 ; sans lui,
      # "docker build" ne produit qu'une image pour l'architecture du runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nico579dock/blink2video:latest
            nico579dock/blink2video:${{ steps.etiquette.outputs.version }}

  publish:
    name: publier la release
    # Attend build-win7 (sans quoi publish pourrait s'executer et publier
    # avant que son artefact n'existe, une course deja vue avec un job plus
    # lent que le reste) mais ne l'exige pas : "if" ne verifie que build,
    # les trois bundles stables partent meme si l'edition Win7 a echoue.
    needs: [build, build-win7]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artefacts/**/*
          generate_release_notes: true

  # Analyse antivirus multi-moteurs des archives publiées, en plus du scan
  # Defender local (qui ne reproduit pas le controle cloud declenche par le
  # Mark-of-the-Web sur un fichier telecharge par navigateur). Necessite le
  # secret de depot VIRUSTOTAL_API_KEY (cle API du compte virustotal.com,
  # Settings > API Key). Best effort comme docker/build-win7 : un echec ici
  # ne doit pas remettre en cause une release deja publiee.
  virustotal:
    name: analyser sur VirusTotal
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Soumettre les archives et lier les rapports dans la release
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            artefacts/**/*.zip
            artefacts/**/*.tar.gz
          update_release_body: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
