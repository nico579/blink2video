name: Release (build 3 OS)

# Construction des bundles autonomes sur les trois systèmes, puis publication
# sur la release. PyInstaller n'est pas un compilateur croisé : chaque binaire
# doit être produit sur son système natif, avec sa propre copie de ffmpeg. Les
# runners GitHub le font gratuitement, ce qui évite d'avoir un Mac et une
# machine Linux sous la main.
#
# Déclenchement :
#   - poussée d'une étiquette stable vX.Y.Z
#   - manuel, en indiquant l'étiquette
#
# Fichiers produits :
#   blink2video-windows-x86_64.zip
#   blink2video-linux-x86_64.tar.gz
#   blink2video-macos-arm64.zip
#   blink2video-windows7-x86_64-legacy.zip

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release (ex : v1.0.0)"
        required: true

# Droits minimaux du GITHUB_TOKEN : lecture seule. Un job qui publie
# déclare lui-même le droit d'écriture dont il a besoin.
permissions:
  contents: read

jobs:
  # L'etiquette et le code doivent dire la meme version. Sans ce controle, on
  # peut publier v9.9.9 depuis un code qui se croit en 0.2.1, et le binaire
  # telecharge ment sur ce qu'il est.
  version:
    name: etiquette et code d'accord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Comparer
        shell: bash
        run: |
          etiquette="${{ github.event.inputs.tag || github.ref_name }}"
          code="v$(python -c 'import runtime; print(runtime.VERSION)')"
          echo "etiquette $etiquette, code $code"
          if [ "$etiquette" != "$code" ]; then
            echo "::error::l'etiquette $etiquette ne correspond pas a runtime.VERSION ($code)"
            exit 1
          fi

  build:
    name: build ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: blink2video-windows-x86_64
            archive: zip
            exe: dist/blink2video/blink2video.exe
          - os: ubuntu-22.04
            asset: blink2video-linux-x86_64
            archive: tar
            exe: dist/blink2video/blink2video
          - os: macos-latest
            asset: blink2video-macos-arm64
            archive: zip
            exe: dist/blink2video/blink2video

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Le même build.py qu'en local : il crée son environnement isolé et
      # appelle PyInstaller. Une seule recette à maintenir, et ce qui est
      # publié est exactement ce qu'on peut reproduire chez soi.
      - name: Construire le bundle
        run: python build.py

      - name: Vérifier que l'exécutable répond
        shell: bash
        run: ${{ matrix.exe }} --help

      # ffmpeg rend le bundle autonome, mais sa seule présence ne suffit pas :
      # les compilations sans libfreetype produisent des vidéos sans horodatage,
      # sans la moindre erreur. On refuse de publier une archive muette.
      - name: Vérifier que ffmpeg sait incruster du texte
        shell: bash
        run: |
          embarque=$(find dist/blink2video -iname 'ffmpeg*' -type f | head -1)
          test -n "$embarque" || { echo "ffmpeg absent du bundle"; exit 1; }
          echo "ffmpeg embarqué : $embarque"
          "$embarque" -hide_banner -filters | grep -q drawtext             || { echo "le ffmpeg embarqué ne sait pas incruster de texte"; exit 1; }

      # imageio_ffmpeg ne fournit pas de build Linux avec libfreetype (voir
      # build.py, FFMPEG_SECOURS) : le secours téléchargé à la place embarque
      # ffprobe dans la même archive, extrait au passage. Sans lui,
      # merge_daily.valid_mp4_complet() retombe sur une copie de flux ffmpeg
      # avec -xerror pour valider un téléchargement, bien plus stricte et
      # prompte à refuser un fichier pourtant exploitable (issue GitHub #10).
      - name: Vérifier que le bundle Linux embarque aussi ffprobe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sonde=$(find dist/blink2video -iname 'ffprobe*' -type f | head -1)
          test -n "$sonde" || { echo "ffprobe absent du bundle Linux"; exit 1; }
          echo "ffprobe embarqué : $sonde"
          "$sonde" -version | head -1

      # Épreuve complète sur l'exécutable qui sera publié, horodatage compris.
      - name: Éprouver la chaîne vidéo depuis le bundle
        shell: bash
        env:
          BLINK_TEST_BUNDLE: ${{ matrix.exe }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python tests.py

      - name: Empaqueter (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: cd dist && 7z a -tzip "${{ matrix.asset }}.zip" blink2video || zip -r "${{ matrix.asset }}.zip" blink2video

      - name: Empaqueter (tar.gz)
        if: matrix.archive == 'tar'
        run: cd dist && tar czf "${{ matrix.asset }}.tar.gz" blink2video

      # L'updater refuse désormais toute archive sans empreinte vérifiable.
      # Le nom du fichier est inclus afin d'empêcher d'associer par erreur
      # l'empreinte d'une autre plateforme au bundle téléchargé.
      - name: Publier l'empreinte SHA-256
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          racine = Path("dist")
          prefixe = "${{ matrix.asset }}."
          archives = [p for p in racine.iterdir()
                      if p.is_file() and p.name.startswith(prefixe)
                      and not p.name.endswith(".sha256")]
          if len(archives) != 1:
              raise SystemExit(f"archive unique introuvable : {archives}")
          archive = archives[0]
          empreinte = hashlib.sha256()
          with archive.open("rb") as source:
              for bloc in iter(lambda: source.read(1024 * 1024), b""):
                  empreinte.update(bloc)
          archive.with_name(archive.name + ".sha256").write_text(
              f"{empreinte.hexdigest()}  {archive.name}\n", encoding="ascii")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*

  # Meme recette que le CI continu sur main (voir build-win7.yml), construite
  # ici pour l'etiquette de la release plutot que pour la HEAD de main. Best
  # effort par nature (edition legacy, hors support Microsoft) : un
  # echec ici ne doit pas retenir les trois bundles stables, d'ou le job
  # separe et le "if" de publish plus bas, meme raisonnement que pour docker.
  build-win7:
    name: build Windows 7 (legacy)
    needs: version
    uses: ./.github/workflows/build-win7.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # Image publiee sur Docker Hub, en plus des trois binaires. Job separe du
  # matriciel "build" : un echec ici (secrets Docker Hub absents ou invalides)
  # ne doit jamais empecher la publication des binaires, qui n'en dependent
  # pas. Necessite deux secrets du depot (Settings > Secrets and variables >
  # Actions) : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton d'acces cree sur
  # hub.docker.com > Account Settings > Security, jamais le mot de passe du
  # compte).
  docker:
    name: publier l'image Docker
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN vivent dans l'environnement GitHub
    # "docker" (Settings > Environments), pas en secrets de repo : sans cette
    # ligne, un job ne voit que les secrets de repo, jamais ceux d'un
    # environnement, meme du meme nom.
    environment: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Deduire la version (sans le "v")
        id: etiquette
        shell: bash
        run: |
          etiquette="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${etiquette#v}" >> "$GITHUB_OUTPUT"

      # QEMU emule les autres architectures sur le runner amd64 de GitHub,
      # pour que buildx puisse construire l'image arm64 (Raspberry Pi, Apple
      # Silicon sous Docker Desktop) sans machine arm dediee. Buildx est le
      # constructeur multi-plateforme de Docker depuis 2019 ; sans lui,
      # "docker build" ne produit qu'une image pour l'architecture du runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Connexion Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nico579dock/blink2video:latest
            nico579dock/blink2video:${{ steps.etiquette.outputs.version }}

  publish:
    name: publier la release
    # Attend build-win7 (sans quoi publish pourrait s'executer et publier
    # avant que son artefact n'existe, une course deja vue avec un job plus
    # lent que le reste) mais ne l'exige pas : "if" ne verifie que build,
    # les trois bundles stables partent meme si l'edition Win7 a echoue.
    needs: [build, build-win7]
    # Sans always(), GitHub saute implicitement tout job dont une dependance a
    # echoue, avant meme d'evaluer needs.build.result. Win7 reste donc attendu
    # pour recuperer son artefact s'il existe, mais son echec legacy ne
    # retient plus les trois editions stables.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # pattern exclut l'artefact de provenance/attestation que docker/
      # build-push-action@v6 depose automatiquement a cote (nom du type
      # "<compte>~<repo>~<id>.dockerbuild", jamais nomme par ce workflow) :
      # sans ce filtre, download-artifact telecharge aussi cet artefact-la,
      # systematiquement en echec ("Artifact download failed after 5
      # retries", constate en reel sur 3 tentatives, 2026-09-03), alors que
      # les 4 vrais binaires (blink2video-*) telechargent sans probleme a
      # chaque fois. L'image Docker elle-meme est deja publiee directement
      # sur Docker Hub par ce meme step (push: true), rien a en recuperer
      # ici.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefacts
          pattern: blink2video-*

      # gh, la CLI officielle de GitHub déjà présente sur le runner, plutôt
      # qu'une action tierce dans le seul job qui a le droit d'écrire : un tag
      # d'action déplacé par un attaquant y remplacerait les archives que la
      # mise à jour intégrée installe. Même principe que release.yml de
      # lidar2map. L'étiquette passe par l'environnement, jamais interpolée
      # dans le script : l'entrée manuelle « tag » ne peut rien y injecter.
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artefacts/*/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artefacts/*/* --generate-notes --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
