name: Expérience, actions Docker autorisées

# Jetable, sur sa propre branche : le dépôt n'accepte plus que les actions de
# GitHub et des créateurs vérifiés. Ce workflow vérifie que les actions
# docker/* du job docker de release.yml restent autorisées, en installant
# QEMU et Buildx avec les mêmes versions épinglées. Aucune connexion, aucun
# envoi.

on:
  push:
    branches: [experience/launchd]
    paths: ['.github/workflows/experience-actions-autorisees.yml']

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx version
