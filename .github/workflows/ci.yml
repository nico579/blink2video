name: CI

# Deux niveaux de contrôle. Sur les trois systèmes, la chaîne vidéo complète,
# éprouvée sur des clips fabriqués par ffmpeg : c'est la partie qui casse, et
# elle ne demande aucun compte. Sur Windows seulement, la construction du
# bundle, plus lente et déjà couverte par le workflow de publication.
#
# Ce qui n'est pas testé ici, et ne peut pas l'être : tout ce qui touche au
# compte Blink (connexion, téléchargement, direct, armement). Des identifiants
# n'ont rien à faire dans un service d'intégration, et la vérification en deux
# étapes bloquerait de toute façon. Les notifications de bureau non plus : un
# runner n'a pas de session graphique.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  caracterisation:
    name: caractérisation ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # tzdata et imageio-ffmpeg manquaient ici alors que runtime.DEPENDANCES
      # les exige inconditionnellement. Sans effet visible
      # tant que runtime.bootstrap() n'était appelé qu'une fois, tout en haut
      # de blink2video.py, au moment de l'import ; l'étape 8 l'a rendu
      # paresseux (appelé depuis accueillir()/executer()/main(), et par les
      # imports de serve.py/watch.py déjà existants), ce qui a suffi à révéler
      # ce trou dès la première exécution réelle de ce job.
      - name: Installer les dépendances minimales
        run: python -m pip install --quiet -r requirements.txt

      # Découverte complète : chaque nouveau fichier test_*.py entre
      # automatiquement dans la CI. Une liste écrite à la main en laissait plus
      # de la moitié de côté, notamment le stockage XR et la supervision.
      - name: Tests unitaires et de caractérisation blink2video
        env:
          BLINK_BOOTSTRAP: none
        run: python -B -m unittest discover -v

  tester:
    name: chaîne vidéo ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Le ffmpeg livré par imageio-ffmpeg pour Linux est compilé sans
      # libfreetype, donc sans le filtre drawtext qui incruste l'heure. Sur ce
      # système on installe celui de la distribution, complet. Windows et macOS
      # se contentent du binaire embarqué, qui, lui, sait le faire.
      - name: Installer ffmpeg complet (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Installer les dépendances
        run: python -m pip install --quiet -r requirements.txt

      - name: Compiler tous les modules
        # Tout le dépôt, et non une liste de fichiers : celle-ci citait encore
        # review.py, disparu depuis, et ignorait quatre modules.
        run: python -m compileall -q .

      # Les verbes n'existent qu'à un seul endroit, runtime.VERBES. Ce contrôle
      # échoue si les README ne reflètent plus cette table : une dérive doit
      # être signalée, pas tolérée jusqu'à ce que quelqu'un s'en aperçoive.
      - name: Vérifier que les README sont à jour
        if: runner.os == 'Linux'
        run: python docs.py --check

      - name: Éprouver la chaîne vidéo et l'interface
        run: python tests.py

  bundle:
    name: bundle ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: blink2video-windows-x86_64
            exe: dist/blink2video/blink2video.exe
          - os: ubuntu-22.04
            asset: blink2video-linux-x86_64
            exe: dist/blink2video/blink2video
          - os: macos-latest
            asset: blink2video-macos-arm64
            exe: dist/blink2video/blink2video
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Construire le bundle
        run: python build.py

      # Jusqu'où le binaire descend, lu dans le fichier plutôt que deviné : le
      # README annonce un système minimal et rien ne le vérifiait. Sur macOS la
      # version cible est inscrite dans l'en-tête Mach-O ; sous Linux, c'est la
      # plus haute version de glibc exigée par les symboles importés qui décide
      # de la distribution la plus ancienne.
      - name: Système minimal exigé par le bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          # Tout le bundle, et non le seul lanceur : ce sont les bibliothèques
          # embarquées qui exigent le plus, et donc elles qui décident.
          minos=$(find dist/blink2video -type f -exec sh -c '
                    file -b "$1" | grep -q "Mach-O" && vtool -show-build "$1"
                  ' _ {} \; 2>/dev/null                   | awk '/minos/ {print $2}' | sort -V | tail -1)
          echo "macOS minimal exigé : ${minos:-inconnu}"
          echo "macOS minimal exigé : ${minos:-inconnu}" >> "$GITHUB_STEP_SUMMARY"

      - name: Système minimal exigé par le bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          glibc=$(find dist/blink2video -type f \( -name '*.so*' -o -perm -u+x \)                   -exec objdump -T {} + 2>/dev/null                   | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "glibc minimale exigée : ${glibc:-inconnue}"
          echo "glibc minimale exigée : ${glibc:-inconnue}" >> "$GITHUB_STEP_SUMMARY"

      # Le bundle doit être autonome : aucun ffmpeg du système ne doit être
      # nécessaire, et celui qu'il embarque doit savoir incruster du texte,
      # sans quoi les vidéos sortiraient sans horodatage.
      - name: Vérifier que le bundle est autonome et sait horodater
        shell: bash
        run: |
          ${{ matrix.exe }} --help
          embarque=$(find dist/blink2video -iname 'ffmpeg*' -type f | head -1)
          test -n "$embarque" || { echo "ffmpeg absent du bundle"; exit 1; }
          echo "ffmpeg embarqué : $embarque"
          "$embarque" -hide_banner -filters | grep -q drawtext             || { echo "le ffmpeg embarqué ne sait pas incruster de texte"; exit 1; }

      # Épreuve complète sur l'exécutable figé, pas sur les sources : c'est
      # bien ce qui sera distribué que l'on éprouve, horodatage compris, et
      # sans qu'aucun ffmpeg du système ne puisse voler la vedette.
      - name: Éprouver la chaîne vidéo depuis le bundle
        shell: bash
        env:
          BLINK_TEST_BUNDLE: ${{ matrix.exe }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python tests.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/blink2video

  docker:
    name: image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t blink2video:ci .

      # Meme risque que pour le bundle (voir "Vérifier que le bundle est
      # autonome et sait horodater" ci-dessus) : sans ffmpeg complet, les
      # vidéos sortiraient sans horodatage, en silence.
      - name: Verifier que l'image sait horodater (drawtext)
        run: docker run --rm --entrypoint ffmpeg blink2video:ci -hide_banner -filters | grep -q drawtext

      # Démarre le conteneur comme un utilisateur le ferait (docker run, port
      # publié) et vérifie que la page sert bien du HTML reconnaissable,
      # avant d'avoir un vrai compte Blink pour aller plus loin.
      - name: Demarrer le conteneur et interroger la page
        run: |
          docker run -d --name blink2video-ci -p 127.0.0.1:8765:8765 blink2video:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/ -o page.html; then break; fi
            sleep 1
          done
          grep -q "blink2video" page.html || { echo "page inattendue"; docker logs blink2video-ci; exit 1; }
          docker stop blink2video-ci
