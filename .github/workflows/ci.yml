name: CI

# Deux niveaux de contrôle. Sur les trois systèmes, la chaîne vidéo complète,
# éprouvée sur des clips fabriqués par ffmpeg : c'est la partie qui casse, et
# elle ne demande aucun compte. Sur Windows seulement, la construction du
# bundle, plus lente et déjà couverte par le workflow de publication.
#
# Ce qui n'est pas testé ici, et ne peut pas l'être : tout ce qui touche au
# compte Blink (connexion, téléchargement, direct, armement). Des identifiants
# n'ont rien à faire dans un service d'intégration, et la vérification en deux
# étapes bloquerait de toute façon. Les notifications de bureau non plus : un
# runner n'a pas de session graphique.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  tester:
    name: chaîne vidéo ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Le ffmpeg livré par imageio-ffmpeg pour Linux est compilé sans
      # libfreetype, donc sans le filtre drawtext qui incruste l'heure. Sur ce
      # système on installe celui de la distribution, complet. Windows et macOS
      # se contentent du binaire embarqué, qui, lui, sait le faire.
      - name: Installer ffmpeg complet (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Installer les dépendances
        run: python -m pip install --quiet aiohttp blinkpy tzdata imageio-ffmpeg

      - name: Compiler tous les modules
        run: python -m compileall -q blink.py merge_daily.py review.py watch.py daily.py runtime.py build.py tests.py

      - name: Vérifier l'aide de chaque verbe
        run: |
          python blink.py --bootstrap=none --help
          python blink.py --bootstrap=none merge --help
          python blink.py --bootstrap=none review --help
          python blink.py --bootstrap=none watch --help

      - name: Éprouver la chaîne vidéo et l'interface
        run: python tests.py

  bundle:
    name: bundle autonome
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Vérifier que le bundle est autonome
        shell: bash
        run: |
          ./dist/blink/blink.exe --help
          find dist/blink -iname 'ffmpeg*' | grep -q . || { echo "ffmpeg absent"; exit 1; }
