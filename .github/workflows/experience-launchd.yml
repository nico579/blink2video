name: Expérience launchd (issue 31)

# Expérience jetable, sur sa propre branche : que fait launchd d'un agent tué
# par SIGTERM, comme le fait « blink2video stop » ? Un petit agent Python est
# inscrit sous quatre politiques, reçoit SIGTERM, et l'on compte combien de
# fois launchd l'a démarré. Rien de blink2video n'est exécuté.

on:
  push:
    branches: [experience/launchd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launchd:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Agents launchd tués par SIGTERM
        shell: bash
        run: |
          set -u
          sw_vers
          echo "utilisateur : $(id -un) (uid $(id -u))"
          dossier="$RUNNER_TEMP/launchd"
          mkdir -p "$dossier" "$HOME/Library/LaunchAgents"

          cat > "$dossier/agent.py" <<'PY'
          import os, signal, sys, threading, time
          journal, mode = sys.argv[1], sys.argv[2]
          with open(journal, "a") as f:
              f.write(f"demarrage {os.getpid()} {time.time():.1f}\n")
          if mode == "sigwait":
              # Le fil principal bloque SIGTERM et reste occupé, comme sous
              # AppKit ; un fil dédié attend le signal et sort avec le code 0.
              signal.pthread_sigmask(signal.SIG_BLOCK, {signal.SIGTERM})
              def attendre():
                  signal.sigwait({signal.SIGTERM})
                  with open(journal, "a") as f:
                      f.write(f"sigterm recu {os.getpid()}, sortie 0\n")
                  os._exit(0)
              threading.Thread(target=attendre, daemon=True).start()
          while True:
              time.sleep(1)
          PY

          domaine="gui/$(id -u)"
          if ! launchctl print "$domaine" >/dev/null 2>&1; then
            domaine="user/$(id -u)"
          fi
          echo "domaine launchd : $domaine"

          essai() {
            nom="$1"; keepalive="$2"; mode="$3"
            label="com.nico579.experience.$nom"
            plist="$HOME/Library/LaunchAgents/$label.plist"
            journal="$dossier/$nom.log"
            : > "$journal"
            cat > "$plist" <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key><array>
              <string>/usr/bin/python3</string>
              <string>$dossier/agent.py</string>
              <string>$journal</string>
              <string>$mode</string>
            </array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key>$keepalive
          </dict></plist>
          XML
            launchctl bootstrap "$domaine" "$plist" || echo "bootstrap refusé pour $label"
            # launchd ne relance pas un agent plus d'une fois toutes les 10 s
            # (ThrottleInterval) : on le laisse tourner 12 s avant le signal,
            # puis on attend 25 s une éventuelle relance.
            sleep 12
            pid=$(awk '/^demarrage/ {p=$2} END {print p}' "$journal")
            echo "--- $nom : SIGTERM au PID ${pid:-?}"
            [ -n "${pid:-}" ] && kill -TERM "$pid"
            sleep 25
            demarrages=$(grep -c '^demarrage' "$journal")
            launchctl print "$domaine/$label" 2>/dev/null \
              | grep -iE 'last exit|state =|runs =' | sed 's/^/    /'
            cat "$journal" | sed 's/^/    /'
            echo "RESULTAT $nom : $demarrages démarrage(s) ; relancé après SIGTERM : $([ "$demarrages" -gt 1 ] && echo OUI || echo non)"
            launchctl bootout "$domaine/$label" 2>/dev/null || true
            rm -f "$plist"
            echo "$nom|$demarrages" >> "$dossier/bilan.txt"
          }

          essai keepalive-true "<true/>" defaut
          essai successfulexit-false "<dict><key>SuccessfulExit</key><false/></dict>" defaut
          essai crashed-true "<dict><key>Crashed</key><true/></dict>" defaut
          essai successfulexit-false-sigwait "<dict><key>SuccessfulExit</key><false/></dict>" sigwait

          echo
          echo "===== BILAN (démarrages par agent ; plus de 1 = relancé après SIGTERM)"
          cat "$dossier/bilan.txt"
